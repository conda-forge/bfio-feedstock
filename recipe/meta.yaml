{% set name = "bfio" %}
{% set version = "2.5.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/PolusAI/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 84c11dc1848cfcd7f1cbd36e001a1e04c4c02a7e72d6a5830b2f86a395bec2b4
build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - imagecodecs >=2021.2.26
    - jpype1
    - numpy >=1.20.1
    - ome-types >=0.4.2
    - pip
    - setuptools
    - python {{ python_min }}
    - scyjava
    - tifffile >=2021.8.30
    - zarr >=2.6.1
    - bfiocpp
  run:
    - imagecodecs >=2021.2.26
    - jpype1
    - numpy >=1.20.1
    - ome-types >=0.4.2
    - python >={{ python_min }}
    - scyjava
    - tifffile >=2021.8.30
    - zarr >=3.0.0
    - bfiocpp >=0.4.0

test:
  imports:
    - bfio
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/bfio/
  summary: Simple reading and writing classes for tiled tiffs using Bioformats.
  dev_url: https://github.com/PolusAI/bfio
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Nicholas-Schaub
    - sameeul
    - jaimergp
